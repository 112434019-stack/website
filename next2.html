<!DOCTYPE html>
<html>
<head>
    <title>HTML Form Example</title>
</head>

<body>

<h2>Student Information Form</h2>

<form>

    <!-- Text Field -->
    <label>Student Name:</label><br>
    <input type="text" placeholder="Enter your name"><br><br>

    <!-- Text Area -->
    <label>Address:</label><br>
    <textarea rows="4" placeholder="Enter your address"></textarea><br><br>

    <!-- Radio Button -->
    <label>Gender:</label><br>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <br><br>

    <!-- Combo Box -->
    <label>Department:</label><br>
    <select>
        <option>Select Department</option>
        <option>CSE</option>
        <option>ECE</option>
        <option>EEE</option>
        <option>Mechanical</option>
        <option>Civil</option>
    </select>
    <br><br>

    <!-- List Box -->
    <label>Favorite Subjects:</label><br>
    <select multiple size="4">
        <option>HTML</option>
        <option>CSS</option>
        <option>JavaScript</option>
        <option>Python</option>
        <option>Java</option>
    </select>
    <br><br>

    <!-- Check Box -->
    <label>Hobbies:</label><br>
    <input type="checkbox"> Reading<br>
    <input type="checkbox"> Sports<br>
    <input type="checkbox"> Music<br>
    <input type="checkbox"> Dancing
    <br><br>

    <!-- Button -->
    <button type="submit">Submit</button>

</form>

</body>
</html>
